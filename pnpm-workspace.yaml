packages:
  # The SDLC tooling: one package per module, the project's own (docs/kit/registry.md).
  - "tooling/*"
  # The product, decided in /kickoff (topic 9).
  - "apps/*"
  - "packages/*"

# Install scripts are denied unless listed here (docs/kit/security.md § Supply chain).
onlyBuiltDependencies: []

# New package versions are not installed until they are a day old
# (docs/kit/security.md § Supply chain).
minimumReleaseAge: 1440
